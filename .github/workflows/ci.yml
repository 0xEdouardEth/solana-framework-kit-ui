name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Types · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build library
        run: bun run build

      - name: Check bundle size
        run: bunx size-limit

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/ui/dist/
          if-no-files-found: error

  changeset:
    name: Changeset check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for changeset
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}" = "true" ]; then
            echo "Skipping changeset check (skip-changeset label detected)"
            exit 0
          fi
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" | wc -l | tr -d ' ')
          if [ "$CHANGESETS" -eq "0" ]; then
            echo "❌ No changeset found. Add one with: bun run changeset"
            echo "   Or add the 'skip-changeset' label if this PR doesn't need a release."
            exit 1
          fi
          echo "✅ Found $CHANGESETS changeset(s)"
