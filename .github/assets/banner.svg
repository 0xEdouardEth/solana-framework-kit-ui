<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#2e3248"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#0f1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f1117" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%"   stop-color="#9945ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9945ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#9945ff"/>
      <stop offset="60%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#14f195"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#0f1117"/>
  <rect width="800" height="200" fill="url(#dots)"/>
  <rect width="800" height="200" fill="url(#vignette)"/>
  <rect width="800" height="200" fill="url(#glow)"/>

  <!-- Title: "Solana" -->
  <text
    x="400" y="90"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="44"
    font-weight="900"
    letter-spacing="-2"
  >
    <tspan fill="#e8eaf6">Solana </tspan>
    <tspan fill="url(#textGrad)">Framework Kit</tspan>
    <tspan fill="#e8eaf6"> UI</tspan>
  </text>

  <!-- Subtitle -->
  <text
    x="400" y="130"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="15"
    font-weight="400"
  >
    <tspan fill="#7b82a8">A React component library built on top of </tspan>
    <tspan fill="#9945ff">@solana/framework-kit</tspan>
    <tspan fill="#7b82a8">.</tspan>
  </text>
</svg>
